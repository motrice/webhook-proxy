# GitHub is the primary remote and owns the policy layer: conventional commits,
# REUSE/licence compliance, SAST, dependency review, OpenSSF-friendly pinning.
#
# diggsweden/reusable-ci is pinned to a tag's full commit SHA, not a moving ref.
# Update deliberately, in its own commit:
#   v3.0.0 = 997d7dc2238b40c79798fda309d8061b0707a3e5
name: pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Policy and security. reusable-ci has no cargo build workflow, so it checks
  # everything about the change except whether the code works.
  policy:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@997d7dc2238b40c79798fda309d8061b0707a3e5 # v3.0.0
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    with:
      project-type: cargo
      # v3.0.0: devbasecheck supersedes the commitlint/licenselint/megalint
      # trio, which are deprecated. Enabling both would double-report.
      linters.devbasecheck: true
      linters.commitlint: false
      linters.licenselint: false
      linters.megalint: false
      linters.dependencyreview: true
      security.sast-opengrep: true
      security.sast-opengrep-fail-on-severity: medium

  # Correctness. `just check` is the same recipe an agent runs locally and the
  # same one the Forgejo gate runs. Together with the hygiene linting in the
  # policy job above, these two jobs compose to `just verify` — one definition
  # of green, checked in two places because they need different toolchains.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install just and cargo-machete
        run: |
          set -euo pipefail
          cargo install just --locked --version 1.50.0
          cargo install cargo-machete --locked

      - name: just check
        run: just check

  # The hexagon, called out as its own required check so an architectural change
  # is visible in the PR's check list rather than buried in the check job's log.
  # Covers both rules: dependency direction and the domain's freedom from
  # effects.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Architecture rules
        run: cargo test -p architecture -- --nocapture
