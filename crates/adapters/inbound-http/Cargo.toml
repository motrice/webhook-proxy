[package]
name = "inbound-http"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../../domain" }
application = { path = "../../application" }
axum = "0.8"
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
# The real hand-off store, not a fake. An adapter may not depend on another
# adapter, but a DEV-dependency may — boundaries.rs says so deliberately, so a
# test can prove the production path — and a second in-memory Handover written
# here would be a second implementation to keep honest.
memory-outbox = { path = "../memory-outbox" }
tokio = { version = "1", features = ["macros", "rt"] }
# Drives the router without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Captures log output, so a test can prove no secret reaches it.
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true
