[package]
name = "yaml-config"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# For TenantId. An adapter may depend on the application layer, and this is
# the reason to: bead gc-g9x put tenancy there rather than in the domain, and
# reading the tenant out of the file as its own type means one validation
# rather than a string here and a parse somewhere else.
application = { path = "../../application" }
domain = { path = "../../domain" }
serde = { version = "1", features = ["derive"] }
# serde_yaml was archived in 2024. serde_yaml_ng is its maintained continuation
# with the same API, which matters here because the alternative is hand-rolled
# YAML parsing — and a parser that disagrees with every other YAML reader about
# an edge case would turn this file's whole purpose, being reviewable, into a
# trap.
serde_yaml_ng = "0.10"

[dev-dependencies]
# Each test needs a secrets directory of its own. Dev-only.
tempfile = "3"

[lints]
workspace = true
