[package]
name = "element-notices"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../../domain" }
application = { path = "../../application" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "net"] }
# A stub hookshot, so the request this adapter sends can be asserted without
# touching a real instance.
axum = "0.8"

[lints]
workspace = true
