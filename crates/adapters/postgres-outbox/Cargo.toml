[package]
name = "postgres-outbox"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../../domain" }
application = { path = "../../application" }
async-trait = "0.1"
# Chosen over a bare driver for one reason beyond queries: `migrate!` embeds the
# schema at compile time and applies it behind an advisory lock, so two replicas
# starting together cannot race each other into a half-created schema.
#
# No compile-time query checking: the `query!` macros need a live database at
# build time, which would make `cargo build` depend on a server. The runtime
# `query` functions do not.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "migrate",
  # For `migrate!` only. The `query!` macros live here too and are deliberately
  # not used: they need a live database at build time, which would make `cargo
  # build` depend on a server being up.
  "macros",
] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# Only to run eight claims at once, which is the point of the concurrency test.
futures = "0.3"
# The tests bring their own PostgreSQL rather than expecting one to be running
# (bead gc-e5x). Before this, the ten tests below were `#[ignore]`d and ran only
# when somebody typed a recipe, which meant the store every Dispatch waits in
# was covered by tests no pipeline had ever executed. Dev-dependencies are
# intentionally unrestricted by the architecture rules, so this does not widen
# the hexagon — see crates/architecture/tests/boundaries.rs.
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres"] }

[lints]
workspace = true
