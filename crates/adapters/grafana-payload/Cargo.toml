[package]
name = "grafana-payload"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../../domain" }
application = { path = "../../application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same reason as the Alertmanager adapter: an Alert carries when the sender says
# it began, which is not when we received it, and RFC 3339 with offsets is a
# library's job. Six lines of it are duplicated between the two adapters because
# adapters may not depend on each other — see the commit message.
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
# Only to assert that the two senders are not interchangeable: this crate refuses
# Alertmanager's payload and that one refuses Grafana's. A dev-dependency, so the
# architecture test still sees no adapter depending on an adapter.
alertmanager-payload = { path = "../alertmanager-payload" }

[lints]
workspace = true
