[package]
name = "app"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The binary is named for the product, not for the crate. Everything else
# already says `webhook-proxy` — the error messages, the environment variables,
# the container — and a container whose entrypoint is `/usr/local/bin/app`
# tells an operator nothing about what is running.
[[bin]]
name = "webhook-proxy"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
element-notices = { path = "../adapters/element-notices" }
inbound-http = { path = "../adapters/inbound-http" }
github-payload = { path = "../adapters/github-payload" }
github-signatures = { path = "../adapters/github-signatures" }
shared-values = { path = "../adapters/shared-values" }
alertmanager-payload = { path = "../adapters/alertmanager-payload" }
grafana-payload = { path = "../adapters/grafana-payload" }
yaml-config = { path = "../adapters/yaml-config" }
system = { path = "../adapters/system" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
# Each acceptance test writes its own routing file and secrets directory.
tempfile = "3"
# The acceptance test drives the built binary over real HTTP, and stands up a
# stub hookshot to receive what comes out the other side.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
# The deployment manifests are read by a test, so a manifest that disagrees with
# this crate's environment contract fails the build rather than a pod.
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "process"] }

[lints]
workspace = true
