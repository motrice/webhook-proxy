[package]
name = "application"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain" }
# Only the Dispatcher port is async — it is the only one that touches a network.
# The architecture test's allowlist already permits this for exactly that reason.
async-trait = "0.1"

[dev-dependencies]
# Dev-dependencies are deliberately unrestricted by the architecture test: a
# test may use whatever it needs to prove the production path. A runtime is
# needed only to poll the async Dispatcher in use-case tests.
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
