# The inbound interface, as the code actually implements it.
#
# crates/app/tests/openapi.rs checks this document against the source: the paths
# against the router, the statuses against the handler, and the security schemes
# against the mechanisms the routing file names. A path renamed or a status added
# fails a test rather than leaving this prose quietly false.
#
# Not described here, because it is not this interface: what the proxy sends
# onward to a chat room. See docs/sending-to-this-proxy.md for the sender's view
# in prose, which this makes machine-readable rather than replaces.
openapi: 3.1.0

info:
  title: webhook-proxy
  summary: Relays a verified webhook into an internal chat room.
  description: |
    An authentication boundary in front of chat rooms that have none. The
    destination is a hookshot generic webhook, which supports no inbound
    authentication at all, so this proxy is what decides whether a request is
    genuine.

    **A `202` means accepted, not delivered.** The request was verified and the
    delivery written down; the rooms it fans out to are reached afterwards and
    independently. Do not treat a `202` as proof a human saw anything, and do
    not retry on it.

    **A `202` means stored and offered to the team the sender belongs to.** This
    service does not attempt a room itself: it verifies, stores, and offers the
    delivery to that team, whose own agent delivers it by its own rules to rooms
    this service does not know. That is weaker than an earlier version of this
    document promised, and more honest — a team whose agent is broken leaves
    alerts sitting here, and nothing in a response says so. See `x-limitations`
    for what that costs a sender.

    **Each sender defines how it proves itself, and this interface accommodates
    both.** GitHub signs the body; Alertmanager and Grafana send a token. The
    mechanism is read from configuration per Origin and never chosen by looking
    at the request, so a request arriving at a signing Origin bearing a token is
    refused rather than retried as a token.

    Conformance to the national REST API-profil is claimed for the areas named
    in bead `gc-4oo.2` and not for the profile as a whole. Three SKALL rules are
    excepted there, with reasons:

    - `SAK.01` and `UFN.02`, HTTPS with TLS 1.2 on port 443. Met at the edge
      rather than in the process: TLS terminates at the gateway in front of
      this, so every caller reaches it over HTTPS and the process itself never
      offers it.
    - `DOK.03`, which wants terms of service and a contact email in this
      document. Neither exists and neither is a fact to invent: there is no
      terms of service for an internal receiver on a limited network segment,
      and an undeliverable support address committed here would be worse than a
      named gap.

    No tool checks this paragraph. `just lint-api` compares this document with
    the profile; nothing compares it with the decision, so a claim here that
    drifts from `gc-4oo.2` reads as conformant to anybody who does not open the
    bead.
  version: 0.0.0
  license:
    name: EUPL-1.2
    url: https://github.com/motrice/webhook-proxy/blob/main/LICENSES/EUPL-1.2.txt
  contact:
    name: Motrice AB
    url: https://github.com/motrice/webhook-proxy

  # DOK.08 wants a service level stated rather than implied. These are the
  # numbers the code actually enforces, not aspirations: five attempts over
  # roughly half a minute, and a refusal rather than a silent downgrade when the
  # store is unreachable.
  x-sla:
    availability: |
      Best-effort. Two replicas behind a gateway, and no availability target is
      promised to a sender. The proxy refuses with 503 rather than accepting
      what it cannot promise to keep, so an outage of its store is visible as a
      refusal and never as a quiet loss.

      A team whose own delivery agent has stopped is NOT an outage of this
      service and a sender sees nothing of it: the alerts are stored, offered,
      counted and logged, and dropped after a month. That is the one failure
      this interface cannot report to the sender who caused it.
    responseTime: |
      A 202 is answered as soon as the request is verified and the delivery
      written down, before any room is reached. Reaching a room is not on the
      request path, so a slow or unreachable room does not slow a sender.
    support: |
      Operated by the team that owns the rooms it posts into. Losses are logged
      with the delivery's identity, the room's identity and the reason, and
      counted at /metrics — that log is the answer to "did it arrive", never the
      202.

  # DOK.09 wants known limitations named. These are the same ones
  # docs/sending-to-this-proxy.md states in prose, under "What is lost, in your
  # terms"; a sender should not have to read both to learn the same problem.
  x-limitations: |
    At-least-once, with limits worth knowing before relying on this:

    - Delivery is attempted a bounded number of times, by the team's own agent
      rather than by this service. A room unreachable for long enough loses that
      message, and the loss is logged where it happened — in that team's
      namespace, not here.
    - An alert nobody ever collects is kept for one month from acceptance and
      then dropped. The deletion is logged and counted as a loss rather than
      happening quietly, but no response ever told the sender about it, and
      "accepted" has never meant "kept indefinitely".
    - Repeats are possible. A room can see the same message twice, when a
      request succeeded but its response was lost. Nothing downstream should
      assume exactly-once.
    - Order is not promised. Two notifications can reach one room out of order.
    - A success status from the path is not proof of delivery: a firewall in
      front of the destination answers 200 with an HTML page over a refusal, so
      a dispatch counts as delivered only when the destination itself says so.
    - Long values are cut: a summary at 200 characters, a label name or value at
      60, at most 8 labels and at most 8 alerts shown in a grouped message, with
      any remainder counted rather than hidden.

externalDocs:
  description: What a sender has to know, in prose
  url: https://github.com/motrice/webhook-proxy/blob/main/docs/sending-to-this-proxy.md

servers:
  - url: https://{host}
    description: |
      TLS terminates at the gateway in front of this process, which listens on
      plain HTTP inside the cluster. A caller always reaches it over HTTPS; the
      process is never the thing that offers it.
    variables:
      host:
        default: webhook-proxy.example
        description: The public hostname this deployment is published under.

paths:
  /webhook/{origin}:
    post:
      summary: Receive a webhook from a configured sender.
      description: |
        The path segment is the sender's identity as its own configuration spells
        it, which is why it is not a plural noun and carries no version segment:
        renaming it would break every webhook already registered.

        Verification happens before the body is parsed, and nothing can switch it
        off. An Origin this proxy holds no secret for is refused; there is no
        permissive default.
      operationId: receiveWebhook
      security:
        - githubSignature: []
        - bearerToken: []
      parameters:
        - name: traceparent
          in: header
          required: false
          description: |
            W3C Trace Context. Accepted and carried onward to the room, so a
            message there can be traced back to the push or alert that caused
            it, including when a retry sends it minutes later.

            Never required, and never a cause of refusal: a malformed value is
            replaced with a freshly generated chain rather than rejected, and the
            malformed value is not propagated. The answer carries the chain the
            delivery was filed under, which is how a sender that sent none
            learns it.
          schema:
            type: string
            pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        - name: tracestate
          in: header
          required: false
          description: |
            Opaque, and passed on unexamined. It belongs to whoever set it.
          schema:
            type: string
          example: congo=t61rcWkgMzE
        - name: origin
          in: path
          required: true
          description: The configured sender's identity.
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
          examples:
            github:
              value: github
            alertmanager:
              value: alertmanager
      requestBody:
        required: true
        description: |
          The sender's own notification format, unchanged. This proxy translates
          it; it does not define it.
        content:
          application/json:
            schema:
              type: object
              description: Whatever the sender sends. Translated per Origin.
            examples:
              push:
                summary: A GitHub push
                externalValue: https://github.com/motrice/webhook-proxy/blob/main/crates/adapters/github-payload/fixtures/push.json
      responses:
        "202":
          description: |
            Accepted and written down. Not delivered: the rooms are reached
            afterwards, and a loss after this point is logged and counted rather
            than reported here.
          headers:
            traceparent:
              description: |
                The chain this delivery was filed under — the one sent, or the
                one generated for a caller that sent none.
              schema:
                type: string
            tracestate:
              description: Returned unchanged when one was sent.
              schema:
                type: string
        "400":
          description: |
            The body is not a payload this sender's translator understands.
            Retrying identical content will not help.
        "401":
          description: |
            The credential is absent, malformed, or wrong. Indistinguishable on
            purpose: saying which would tell an unauthenticated caller half the
            answer.
        "404":
          description: No sender is configured at this path.
        "413":
          description: |
            The body is larger than this deployment's configured limit, refused
            before anything is verified or parsed. One mebibyte by default.
        "415":
          description: |
            The body does not say it is `application/json`, or does not say what
            it is at all. One format is translated here, so a hook configured
            with form encoding is a setting to change rather than a payload to
            fix — which is what this status says and a `400` did not.

            Refused after the credential, so a caller without one learns nothing
            about what is accepted: it gets `401` whatever it sent.
        "503":
          description: |
            A secret this proxy needs could not be read, or the store it keeps
            deliveries in could not be reached. Nothing was promised and nothing
            was sent; send it again.

  /health:
    get:
      summary: Whether the process is serving.
      description: |
        Says nothing about whether a room is reachable or a secret is readable —
        a proxy that cannot deliver still answers this. It is what the
        orchestrator reads to decide whether to route traffic here.

        ON THE OPERATOR PORT, not the one the webhook is published on: this
        answers a machine that reaches the pod directly, and the port the
        senders and the teams' agents use is reachable by every team.
      operationId: health
      security: []
      responses:
        "200":
          description: Serving.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api-info:
    get:
      summary: What is answering, and where its documentation is.
      description: |
        VER.06 of the national REST API-profil. At the root rather than under a
        version segment, because `VER.05` is departed: the path a sender posts to
        is its own configuration, not ours to version.

        Reachable without a credential, which decides what it may say. It names
        the product, its version, its status and its documentation. It says
        nothing about which senders are configured, which rooms exist, or what
        this deployment relays — anyone who can reach the port can read this.
      operationId: apiInfo
      security: []
      responses:
        "200":
          description: What is answering.
          content:
            application/json:
              schema:
                type: object
                required: [apiName, apiVersion, apiReleased, apiDocumentation, apiStatus]
                additionalProperties: false
                properties:
                  apiName:
                    type: string
                    description: Read from the binary name, never written out.
                  apiVersion:
                    type: string
                    description: |
                      Read from the crate version, so a release that forgets to
                      update it is impossible rather than discouraged.
                  apiReleased:
                    type: string
                    format: date
                    description: |
                      When this version of the interface was published, RFC 3339.
                  apiDocumentation:
                    type: string
                    format: uri
                  apiStatus:
                    type: string
                    description: |
                      `beta` while the inbound contract is still moving.
                    enum: [beta, stable, deprecated]
              example:
                apiName: webhook-proxy
                apiVersion: 0.0.0
                apiReleased: "2026-10-12"
                apiDocumentation: https://github.com/motrice/webhook-proxy/blob/main/docs/sending-to-this-proxy.md
                apiStatus: beta

  /ready:
    get:
      summary: Whether this pod can do the work.
      description: |
        Asks the delivery store whether it answers, bounded in the process. A
        pod whose store cannot be reached can do none of this interface's work —
        a push that would have been accepted is refused, and a team's agent is
        handed nothing — so it should be taken out of the Service until it can,
        which is what this tells the orchestrator.

        Separate from /health, which is liveness and answers from the process
        alone. Restarting does not reach a store that is down. On the operator
        port, like /health.
      operationId: ready
      security: []
      responses:
        "200":
          description: The store answers; this pod can serve.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: |
            The store is not answering, so this pod should be taken out of the
            Service. No body: the reason is in the process's log, where an
            operator can find it afterwards, and a probe reads a status code.

            DECLARING A BODY HERE WOULD BE THIS SPECIFICATION'S FIRST, and it
            would make RAP-LP's FEL.02 apply — error responses SKALL use
            application/problem+json. Every error in this interface describes
            itself and carries no declared schema, so adopting RFC 9457 for one
            readiness endpoint while 401, 404, 413 and 415 have none would be
            incoherent. Whether this API adopts it at all belongs to bead
            gc-4oo.2, which decided area by area what this proxy follows.

  /metrics:
    get:
      summary: What each room was told, for a scraper.
      description: |
        Prometheus text format. Carries counts per TEAM — how much each has not
        yet collected, how old the oldest of that is, and how much was dropped
        uncollected — and counts per ROOM, on its own team's word: what it
        accepted, and what was given up on with the reason. This service
        reaches no room itself, so the per-room numbers are what each team's
        agent reported rather than what this service observed. A room's NAME
        appears; a room's address cannot, because this service never learns one.
        No secret, no part of any payload.

        ON THE OPERATOR PORT, and that is a boundary rather than a detail: a
        team's agent must be allowed to reach the port the hand-off is on, and
        these series name every team's rooms. A separate socket is the only
        separation available, because an ingress rule selects a port and never
        a path.
      operationId: metrics
      security: []
      responses:
        "200":
          description: The counters.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    githubSignature:
      type: apiKey
      in: header
      name: x-hub-signature-256
      description: |
        An HMAC-SHA256 over the raw body, as GitHub computes it. Configured per
        Origin as `hmac_sha256`. The signature covers the bytes received, so it
        cannot be replayed against a different body.
    bearerToken:
      type: http
      scheme: bearer
      description: |
        A value shared in advance, for a sender that cannot sign a body.
        Configured per Origin as `bearer`. Alertmanager and Grafana authenticate
        this way because neither offers a signature.
