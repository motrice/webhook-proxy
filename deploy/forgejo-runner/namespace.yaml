apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
    # A namespace of its own because this workload runs a privileged container.
    # Keeping it out of the forgejo namespace means a policy applied to the
    # server is not loosened to accommodate the runner.
    app.kubernetes.io/part-of: ci
