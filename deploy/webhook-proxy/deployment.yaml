apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-proxy
  namespace: webhook-proxy
  labels:
    app.kubernetes.io/name: webhook-proxy
spec:
  # Two, because the delivery promise is best-effort and a restart should still
  # cost nothing. The proxy holds no state between requests — it verifies, it
  # translates, it forwards — so a second replica is free of the coordination
  # problem that made the Forgejo runner a single pod.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Nothing goes away before its replacement is ready, so a rolling update
      # never leaves the endpoint unserved. A forge that retries on a 5xx would
      # mostly survive the gap; one that does not would silently lose the push.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-proxy
    spec:
      # The process handles SIGTERM and finishes what it has accepted before
      # exiting, which is what makes "a restart loses at most what is in flight"
      # true rather than aspirational. The acceptance test proving it is
      # a_termination_signal_lets_a_request_already_accepted_finish.
      terminationGracePeriodSeconds: 30
      # The identity the agent authenticates to the secret store with. It holds
      # no Kubernetes permissions; see serviceaccount.yaml.
      serviceAccountName: webhook-proxy
      # NO runAsUser, runAsGroup OR fsGroup, and their absence is deliberate.
      #
      # OpenShift's `restricted-v2` assigns a uid from the namespace's
      # `openshift.io/sa.scc.uid-range` and REJECTS a workload that names its
      # own — the platform recorded exactly that failure for a chart hardcoding
      # 10001. `fsGroup` is range-checked the same way. So a hardcoded id is not
      # a second lock, it is a pod that never starts (bead gc-hzn).
      #
      # `fsGroup: 65532` was here because the proxy had to read a Secret the
      # kubelet mounted root-owned (gc-d01). That Secret is gone: gc-ast.13
      # replaced it with an agent rendering into a tmpfs the pod owns, so the
      # fix outlived the problem it solved. Both containers share whatever uid
      # the platform assigns, and the agent writes `0440`, so owner-read is
      # enough.
      #
      # ON A CLUSTER THAT ASSIGNS NO UID — plain Kubernetes, k3s — the two
      # containers fall back to their images' own `USER`, which may differ, and
      # then the proxy cannot read what the agent wrote. There, set a pod-level
      # `runAsUser` and `fsGroup` to one value both containers share. That is a
      # property of the cluster, not of this workload, which is why it is
      # documented rather than committed.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Required while the repository, and therefore the GHCR package, is
      # private. Created with `kubectl create secret docker-registry`, never
      # committed — see README.md. It disappears when the repository goes public,
      # which gc-rdz carries as a reminder.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: webhook-proxy
          # Published by the release workflow (gc-lw3), never built here: gc-kow
          # decided that a hand-built image would be a second path that diverges
          # from the released one. `main` is the dev tag, rebuilt on every commit
          # to main; the GitOps copy of this manifest pins a digest instead, which
          # is what makes a rollback mean something.
          image: ghcr.io/motrice/webhook-proxy:main
          # Always, because `main` is a moving tag and any other policy would
          # leave a node serving whatever it happened to pull first.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Nothing is ever written: the routing file and the secrets are
            # mounted read-only and the logs go to stdout.
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 0.0.0.0, not the binary's loopback default. A pod listening on
            # loopback is reachable by nothing at all — not the Service, not the
            # kubelet probe — and looks healthy right up to the first request.
            - name: WEBHOOK_PROXY_LISTEN
              value: 0.0.0.0:8080
            # Both paths are inside the volumes mounted below, and
            # crates/app/tests/manifests.rs proves these are the names the binary
            # actually reads: it points each one somewhere broken and checks the
            # binary complains about that place rather than its own default.
            - name: WEBHOOK_PROXY_CONFIG
              value: /etc/webhook-proxy/routing/config.yaml
            - name: WEBHOOK_PROXY_SECRETS_DIR
              value: /vault/secrets
            # Which store a Dispatch waits in, and therefore whether it outlives
            # the process. Naming a secret here is what switches the PostgreSQL
            # outbox on; without it the proxy keeps deliveries in memory and a
            # restart loses whatever was still retrying — see bead gc-vfz, which
            # decided that these rooms want durable delivery and accepted the
            # cost: when the database is unreachable the proxy refuses with 503
            # rather than accepting what it cannot promise to keep.
            #
            # The value is a secret NAME, not a connection string. The string
            # carries a password, so it arrives in the secrets directory like
            # every other secret and never through the environment.
            - name: WEBHOOK_PROXY_DATABASE_SECRET
              value: database-url
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /health
              # The number rather than the `http` name, in all three places, so
              # the manifest test can compare them. A probe aimed at a port
              # nothing listens on makes every pod unready and explains nothing.
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            # The probe answers from the process alone and never touches the chat
            # server, so a failure here really does mean this pod is wedged.
            failureThreshold: 3
          volumeMounts:
            - name: routing
              mountPath: /etc/webhook-proxy/routing
              readOnly: true
            # Where the agent renders them, read-only here because this
            # process only ever reads. A directory of its own rather than a
            # subPath inside the one above: two mounts at one path would have the
            # second shadow the first.
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit: throttling a proxy adds latency to the one thing it
              # does, and the memory limit is what actually bounds a runaway.
              memory: 128Mi
        # The agent, as a plain container, following the pattern this cluster's
        # GitOps already uses for every other service. A native sidecar was
        # proposed here and withdrawn: the race it would have solved — the proxy
        # looking before the directory is filled — belongs either in the
        # platform's template, so every service gets it, or in our own process.
        # It is in our own process, bead gc-6b7: the proxy waits, bounded and
        # polled, and says on stderr what it is waiting for.
        - name: vault-agent
          # REPLACE: the image this cluster publishes its agent as.
          image: openbao:latest
          args: ["agent", "-config=/vault/config/vault-agent.hcl"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
              readOnly: true
            # Writable, necessarily: this is the container that fills it.
            - name: vault-secrets
              mountPath: /vault/secrets
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        # Generated by kustomize from config.example.yaml, so the name carries a
        # hash of the contents and a routing change rolls the pods by itself.
        # That is the "or equivalent" the bead allowed for, and it is better than
        # a checksum annotation: there is nothing to remember to update.
        - name: routing
          configMap:
            name: webhook-proxy-routing
        - name: vault-config
          configMap:
            name: webhook-proxy-vault-agent
        # Memory-backed, so a rendered secret never reaches a disk. The agent
        # writes here and the proxy reads; nothing else mounts it, and it dies
        # with the pod.
        - name: vault-secrets
          emptyDir:
            medium: Memory
