# The identity the agent authenticates to the secret store with.
#
# It holds no Kubernetes permissions and needs none: nothing in this pod talks to
# the API server. What it is for is the Kubernetes auth method on the secret
# store, which trusts this account's projected token and maps it to a role that
# may read this proxy's secrets and nothing else. The role binding lives there,
# not here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-proxy
  namespace: webhook-proxy
  labels:
    app.kubernetes.io/name: webhook-proxy
automountServiceAccountToken: true
