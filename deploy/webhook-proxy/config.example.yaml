# webhook-proxy routing, as a file.
#
# This is a published interface with a schema, not a parsing detail: it is
# reviewed as a diff in the GitOps repository, and what it says decides who may
# send to this proxy and who hears what. Bead gc-ast.3 records the decisions
# below and why each one falls the way it does.
#
# Two rules govern what belongs here:
#
#   * This file holds POLICY — who may send, and who hears what.
#   * The environment holds what the process needs to RUN — where to listen, how
#     long to wait, how large a body to accept.
#
# Secrets are in neither. This file names one; the value is read from a file in
# the secrets directory, rendered there by an agent beside the process. No
# secret value ever appears here, not even as a placeholder.
#
# WHAT IS NOT HERE, AND WHERE IT WENT. There is no `destinations:` and no
# `subscriptions:` — which rooms hear what is a tenant's own business, decided
# in the tenant's own repository and delivered by the tenant's own agent (beads
# gc-g9x and gc-72e.3.2). A file still carrying either is refused, by name, with
# that explanation. See deploy/alert-agent/config.example.yaml for the other
# half, and note that NEITHER HALF CAN NAME THE OTHER'S SECRETS: this one holds
# sender credentials, that one holds room URLs.
#
# Nothing is reloaded while running. A change to the ConfigMap rolls the
# Deployment, so the start-up log always says what was actually loaded — which is
# the record you want when asking why a room went quiet.

# Bumped only when the shape changes incompatibly, so an old binary meeting a new
# file fails with something better than a parse error.
version: 1

# Every tenant this deployment serves.
#
# A tenant is a namespace here, which is why these are spelled as namespace
# names and refused if they could not be one — see bead gc-81d, which records
# that coupling as a fact about this platform rather than a convenience.
#
# LISTED, NEVER INFERRED from the Origins below. If a tenant came into being by
# being mentioned, a typo in one Origin's `tenant` would create a tenant nobody
# has an agent for: the alerts would be accepted, stored, offered to nobody, and
# eventually swept. Listed, the same typo is a startup error that `webhook-proxy
# check` reports before anything deploys. Bead gc-nkb.
tenants:
  - devsecops
  - platform

# Every system permitted to send to this proxy, and how each proves it is
# genuine. An Origin with no verify block is a startup error: there is no third
# state and nothing to default to.
#
# The mechanism is read from here, never from the request. A request arriving at
# an hmac_sha256 Origin bearing a token is refused, not retried as a token —
# otherwise configuration could be talked into a downgrade. See bead gc-ast.2.
#
# ONE ORIGIN SERVES ONE TENANT, and the two Alertmanager senders below are not
# duplication — they are the shape bead gc-nkb decided. A shared Alertmanager
# sends for every tenant and labels each alert with the namespace it came from,
# so the tempting arrangement is one `alertmanager` Origin with the tenant read
# off that label. It is refused: a label comes from a workload annotation,
# written by whoever can deploy, so a label as the tenant would let a deployer
# file their alert under somebody else's. A LABEL IS ROUTING INPUT AND NEVER AN
# AUTHORISATION BOUNDARY.
#
# What it costs, named here rather than discovered: Alertmanager's own
# configuration grows a receiver and a credential per tenant. What it buys is
# that tenant selection happens in Alertmanager's routing, where routing already
# lives, instead of in this proxy's authorisation boundary where it would be a
# hole. GitHub needs no equivalent — a repository already belongs to one team.
origins:
  # Signs the body, so the proof is bound to what was sent.
  - id: github
    # Whose alerts these are. Read from here and never from the request: the
    # Origin's own secret is what proves the Origin, so the tenant is derived
    # from something already authenticated and a sender cannot assert it.
    tenant: devsecops
    # Which vocabulary this sender speaks, so the right translation is applied.
    # Separate from `verify` on purpose: how a sender proves itself and what
    # shape it sends are independent, and a sender that signed an Alertmanager
    # notification would otherwise be untranslatable with nothing saying why.
    speaks: github
    verify:
      hmac_sha256:
        secret: github-webhook-secret

  # Cannot sign a body, so the proof is possession of a shared value and says
  # nothing about the payload. Weaker, deliberately accepted, and the cost is
  # written down in gc-ast.2.
  - id: alertmanager-devsecops
    tenant: devsecops
    speaks: alertmanager
    verify:
      bearer:
        secret: alertmanager-devsecops-token

  # The same sender, for the other tenant, with its own credential. Rotating or
  # withdrawing one tells the other nothing, which is the point: these are two
  # senders as far as this proxy is concerned, because they speak for two
  # different teams.
  - id: alertmanager-platform
    tenant: platform
    speaks: alertmanager
    verify:
      bearer:
        secret: alertmanager-platform-token

  # A second alerting product with its own credential, so one can be rotated or
  # withdrawn without touching the other — and so a rule naming `origin: grafana`
  # means what it says. Both speak about alerts; neither can sign.
  - id: grafana
    tenant: platform
    speaks: grafana
    verify:
      bearer:
        secret: grafana-token
