# The identity the platform authorises, and the only thing this agent presents.
#
# ITS NAMESPACE IS THE TENANT. The platform reads the SPIFFE identity the mesh
# presents — spiffe://<trust domain>/ns/<namespace>/sa/<name> — and takes the
# namespace as the tenant (bead gc-81d). So this object's namespace decides
# whose alerts this agent is offered, and nothing in its configuration does.
#
# It holds NO Kubernetes permissions. There is no Role and no RoleBinding
# anywhere here: this agent reads a ConfigMap the kubelet mounts for it and
# talks to one HTTP endpoint, and a token that could do more would be a token
# worth stealing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-agent
  # REPLACE: the tenant's own namespace, matching the Deployment's.
  namespace: example-tenant
  labels:
    app.kubernetes.io/name: alert-agent
