# The fast inner loop. Runs on the local Forgejo for every push, including
# bead branches, so an agent gets an answer in seconds without spending
# GitHub Actions minutes.
#
# This job runs `just check` — correctness only. The hygiene and security
# layer lives on GitHub (see .github/workflows/pr.yml) and is not duplicated
# here: two definitions of "green" is how the two drift apart.
# Actions are pinned by commit SHA, like the GitHub side: a tag can be moved to
# point at different code, which is the same supply-chain exposure one layer
# down from pinning the reusable workflow.
#
# Forgejo resolves bare action names against its own mirror at
# https://data.forgejo.org. For these tags the mirror shares upstream's history,
# so the SHAs below are the same objects .github/workflows/pr.yml pins — that is
# not a coincidence to be tidied away, it is why one SHA can serve both.
#
# Version choice is constrained by the runner, not by taste: forgejo-runner 9.0.3
# accepts `runs.using` of node12, node16 or node20 only. The mirror's newer tags
# declare node24, and a job using one dies immediately with
# "The runs.using key in action.yml must be one of: [...], got node24".
# So these are pinned at the newest versions that still declare node20.
name: check

on:
  push:
    branches: ["**"]

jobs:
  check:
    runs-on: docker
    container:
      # Built from deploy/ci-image/Containerfile into the runner's own Docker
      # storage — there is no registry behind this tag, and `force_pull` is off
      # in the runner config so nothing tries to find one.
      #
      # That storage is a PersistentVolumeClaim, so the image outlives the pod
      # (gc-guj). Rebuilding is manual: when the Containerfile changes, bump this
      # tag and rebuild, or the existing layer is used unchanged. See that
      # directory's README.
      #
      # It carries rust, node, just and cargo-machete, so this job installs
      # nothing. Installing a toolchain per run would make the fast gate slower
      # than the GitHub gate it exists to pre-empt.
      image: webhook-proxy-ci:1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      # Identical to what an agent runs locally. If this passes and GitHub
      # fails, the difference is policy, never correctness.
      - name: just check
        run: just check
